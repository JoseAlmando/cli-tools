name: tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v6
      - name: Ruff
        run: uvx ruff@0.17.3 check .

  # Conventional Branch for the PR's branch, Conventional Commits for each of its commits (see CONTRIBUTING.md)
  conventions:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
          # The PR's own head, not the merge commit GitHub makes with the base branch
          ref: ${{ github.event.pull_request.head.sha }}
      - uses: actions/setup-python@v6
        with:
          python-version: "3.x"
      # Through the environment, never pasted into the script: a branch name can hold shell syntax
      - name: Branch name
        env:
          HEAD_REF: ${{ github.head_ref }}
        run: python scripts/check_conventions.py branch "$HEAD_REF"
      - name: Commit messages
        env:
          BASE_REF: ${{ github.base_ref }}
        run: python scripts/check_conventions.py range "origin/$BASE_REF..HEAD"

  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python: ["3.9", "3.14"]
        # setup-python has no Python 3.9 build for the newest Ubuntu (the previous LTS has one) nor for ARM macOS
        exclude:
          - os: ubuntu-latest
            python: "3.9"
          - os: macos-latest
            python: "3.9"
        include:
          - os: ubuntu-24.04
            python: "3.9"
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python }}

      - name: Unit tests
        run: python -m unittest discover -s tests -t . -v
        env:
          PYTHONPATH: src

      - name: Install the commands
        run: python -m pip install .

      # The way people install it: uv tool install (on Windows, clt.exe in uv's tool folder)
      - uses: astral-sh/setup-uv@v6
      - name: Install with uv
        run: |
          # A version, not a path: Git Bash on Windows gives python without its .exe, which uv cannot find
          uv tool install --python "${{ matrix.python }}" .
          bin="$(uv tool dir --bin)"
          if [ "$RUNNER_OS" = Windows ]; then bin="$(cygpath -u "$bin")"; fi
          "$bin/clt" --version

      # The installed commands (.exe files on Windows) start, and the exit codes hold without any network
      - name: Smoke test
        env:
          TAIGA_CONF_DIR: ${{ runner.temp }}/taiga
          GITEA_CONF_DIR: ${{ runner.temp }}/gitea
          TAIGA_URL: https://taiga.example.com
          GITEA_URL: https://gitea.example.com
        run: |
          expect() { local want=$1; shift; set +e; "$@"; local got=$?; set -e
                     [ "$got" -eq "$want" ] || { echo "::error::$* exited $got, expected $want"; exit 1; }; }
          clt --version
          clt taiga --help > /dev/null
          clt gt --help > /dev/null
          expect 3 clt taiga --json me
          expect 3 clt gitea --json me
          TAIGA_TOKEN=t expect 4 clt t --json --read-only POST tasks -d '{}'
          GITEA_TOKEN=t expect 4 clt gt --json --read-only tk
          # The skill ships inside the package: install it into a throwaway home
          home="$RUNNER_TEMP/home"
          HOME="$home" USERPROFILE="$home" clt skill install --agent codex
          if [ "$RUNNER_OS" = Windows ]; then home="$(cygpath -u "$home")"; fi
          for file in SKILL.md references/github.md references/jira.md references/azure-devops.md references/jenkins.md .clt-skill; do
            test -f "$home/.agents/skills/clt/$file" || { echo "::error::$file missing from the installed skill"; exit 1; }
          done

      # clt update on the clt that uv installed: a real move to an older release, through uv (on Windows in the
      # background, over the running clt.exe). Two jobs only: GitHub's API allows few calls without a token.
      - name: clt update
        if: matrix.python == '3.14' && matrix.os != 'macos-latest'
        env:
          TARGET: "0.10.0"
        run: |
          bin="$(uv tool dir --bin)"
          log="$(python -c "import tempfile; print(tempfile.gettempdir())")/clt-update.log"
          if [ "$RUNNER_OS" = Windows ]; then bin="$(cygpath -u "$bin")"; log="$(cygpath -u "$log")"; fi
          "$bin/clt" --json update --check
          "$bin/clt" update "$TARGET"
          if [ "$RUNNER_OS" = Windows ]; then
            # Wait for uv's last line in the log; running clt meanwhile would hold the folder uv replaces
            for _ in $(seq 1 90); do
              grep -qE "^(Installed|error)" "$log" 2>/dev/null && break
              sleep 2
            done
            cat "$log"
          fi
          if [ "$("$bin/clt" --version)" != "clt $TARGET" ]; then
            echo "::error::clt update $TARGET left $("$bin/clt" --version 2>&1 | tail -1)"; exit 1
          fi
