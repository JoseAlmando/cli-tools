[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "cli-tools"
version = "0.4.0"
description = "Command-line tools for the APIs of development services (Taiga, Gitea, GitHub, Jira, Azure DevOps)"
readme = "README.md"
requires-python = ">=3.9"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "José A. Dominique" }]
dependencies = []

[project.scripts]
clt = "cli_tools.cli:run"

[tool.setuptools.packages.find]
where = ["src"]

[dependency-groups]
dev = ["ruff"]

[tool.ruff]
line-length = 120
target-version = "py39"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]

[tool.ruff.lint.pycodestyle]
# Code wraps at about 120 columns; a few long strings and test data lines reach 140
max-line-length = 140
